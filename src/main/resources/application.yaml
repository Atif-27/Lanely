server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: FreightFox
  datasource:
    url: jdbc:h2:mem:freightfox;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
